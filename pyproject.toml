[project]
name = "grana-mcp"
version = "0.1.0"
description = "Servidor MCP somente leitura para finanças pessoais no Brasil (Open Finance via Meu Pluggy)"
readme = "README.md"
license = "MIT"
authors = [{ name = "glkwolff" }]
keywords = ["mcp", "open finance", "pluggy", "meu pluggy", "finanças pessoais", "brasil", "nubank"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "keyring==25.7.0",
    "mcp==2.3.0",
    "platformdirs==4.14.5",
    "pydantic==2.14.3",
    "starlette==1.10.0",
    "typer==0.29.1",
    "uvicorn==0.54.0",
    "tzdata==2026.1 ; sys_platform == 'win32'",
    "http-ece==1.2.1",
    "py-vapid==1.9.6",
    "cryptography==50.0.2",
]

[project.urls]
Homepage = "https://github.com/glkwolff/grana-mcp"
Issues = "https://github.com/glkwolff/grana-mcp/issues"
Privacy = "https://github.com/glkwolff/grana-mcp/blob/main/docs/privacy.md"

[project.scripts]
grana-mcp = "grana_mcp.cli:app"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sandbox: contract tests against the Pluggy Sandbox (need GRANA_PLUGGY_SANDBOX_* env vars)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["http_ece", "py_vapid"]  # no type hints upstream
ignore_missing_imports = true
