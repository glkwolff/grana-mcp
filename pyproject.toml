[project]
name = "grana-mcp"
version = "0.1.0"
description = "Servidor MCP somente leitura para finanças pessoais no Brasil (Open Finance via Meu Pluggy)"
readme = "README.md"
license = "MIT"
authors = [{ name = "glkwolff" }]
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "keyring==25.7.0",
    "mcp==2.3.0",
    "platformdirs==4.14.5",
    "pydantic==2.14.3",
    "typer==0.29.1",
    "tzdata==2026.1 ; sys_platform == 'win32'",
]

[project.scripts]
grana-mcp = "grana_mcp.cli:app"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sandbox: contract tests against the Pluggy Sandbox (need GRANA_PLUGGY_SANDBOX_* env vars)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
