# pip/uv: `uvx pre-commit install` once per clone.
repos:
  - repo: local
    hooks:
      - id: check-sensitive
        name: bloquear dados financeiros reais (db, ofx/csv, CPF)
        entry: python3 scripts/check_sensitive.py
        language: system
        pass_filenames: true
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
