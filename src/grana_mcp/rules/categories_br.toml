# Regras embutidas de categorização para estabelecimentos e serviços brasileiros.
#
# Como funciona (ver pipeline/categorize.py):
# - O texto da transação (descrição + estabelecimento) é normalizado: minúsculas,
#   sem acento, tudo que não é letra/dígito vira espaço.
# - Cada padrão também é normalizado e casa com PALAVRAS INTEIRAS. Um "*" no fim
#   casa só o início da palavra ("uber*" casa "dl uberrides"; "raia*" casa "raia2153").
# - Vence a PRIMEIRA regra que casar, na ordem deste arquivo. Por isso
#   Delivery vem antes de Transporte ("99food" antes de "99app").
# - Regras do usuário (set_category_rule) têm prioridade sobre estas.
#
# Só nomes de empresas/serviços públicos e genéricos. Nunca nomes de pessoas.

[[rule]]
category = "Delivery"
patterns = [
  "ifood", "ifd", "ifood com agencia", "99food", "99 food", "rappi", "ze delivery",
  "zé delivery", "aiqfome", "james delivery", "delivery much", "uber eats", "keeta",
  "lalamove",
]

